[project]
name = "gpu-rightsizing-v1"
version = "0.1.1"
description = "Right-size online-inference GPU pods with a history rule, safety margins, a slice grid and a readiness veto, then price the reclaimed GPU-hours."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpu_rightsizing_v1"]

[dependency-groups]
dev = ["pytest"]
