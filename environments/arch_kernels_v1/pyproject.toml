[project]
name = "arch-kernels-v1"
version = "0.1.0"
description = "Write fast, correct C kernels for x86-64 or AArch64; compiled and benchmarked on a real amd64 or arm64 machine for correctness, speedup and peak memory."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.0", "prime-sandboxes>=0.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arch_kernels_v1"]

[dependency-groups]
dev = ["pytest"]
