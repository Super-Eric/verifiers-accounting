[project]
name = "ans-mlops-v1"
version = "0.1.0"
description = "Work a concept-drift incident through ANS-registered agents: verify identities, diagnose the root cause, retrain only when it helps, and get scored on hidden future traffic."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.0", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ans_mlops_v1"]

[dependency-groups]
dev = ["pytest"]
